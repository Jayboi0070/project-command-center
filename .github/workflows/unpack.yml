name: Unpack project
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo
        run: |
          unzip -q ./*.zip -d /tmp/x
          d=$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | head -1)
          rm -rf "$d/.github"
          cp -r "$d"/. .
          rm -f ./*.zip
          git config user.name "unpack"
          git config user.email "unpack@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project"
          git push
